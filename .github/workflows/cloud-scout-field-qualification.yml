name: PhiBot Scout Public Field Qualification

# Explicit operator-triggered live test. Never scheduled, never automatic
# on push/PR, never publishes source bytes or creates a bot.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile reviewed PhiBot source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build --silent
      - name: Offline negative-control qualification
        run: node --test scripts/cloud-field-assert.test.mjs
      - name: One-shot public Scout evidence GET and qualification
        shell: bash
        run: |
          set -euo pipefail
          # Never print raw worker data; no artifact upload or persistence.
          node dist/src/cloud-inspect-cli.js > "$RUNNER_TEMP/phi-cloud-public-review.json"
          node scripts/cloud-field-assert.mjs "$RUNNER_TEMP/phi-cloud-public-review.json"
          rm -f "$RUNNER_TEMP/phi-cloud-public-review.json"
