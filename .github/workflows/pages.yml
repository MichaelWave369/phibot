name: PhiBot React Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "web/market-lab/**"
      - "src/market/**"
      - "scripts/build-market-lab.mjs"
      - "test/market-reality-check.test.ts"
      - "test/market-browser-lab.test.ts"
      - "test/market-dynamic-challenge.test.ts"
      - "test/market-dynamic-browser-lab.test.ts"
      - "test/market-adaptive-challenge.test.ts"
      - "test/market-adaptive-browser-lab.test.ts"
      - "test/market-capability-ladder.test.ts"
      - "test/market-capability-browser-lab.test.ts"
      - "scripts/market-browser-boundary.test.mjs"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/market-lab/**"
      - "src/market/**"
      - "scripts/build-market-lab.mjs"
      - "test/market-reality-check.test.ts"
      - "test/market-browser-lab.test.ts"
      - "test/market-dynamic-challenge.test.ts"
      - "test/market-dynamic-browser-lab.test.ts"
      - "test/market-adaptive-challenge.test.ts"
      - "test/market-adaptive-browser-lab.test.ts"
      - "test/market-capability-ladder.test.ts"
      - "test/market-capability-browser-lab.test.ts"
      - "scripts/market-browser-boundary.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phibot-react-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install public-site dependencies
        run: npm install --no-audit --no-fund
        working-directory: site
      - name: Enforce public-only contract
        run: npm run test:contract
        working-directory: site
      - name: Build React showcase
        run: npm run build
        working-directory: site
      - name: Package isolated PocketBrain browser lab
        run: |
          npm install --no-audit --no-fund
          npm run market:build
          mkdir -p site/dist/market-lab
          cp -R .market-host-dist/. site/dist/market-lab/
      - name: Upload Pages artifact on main
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
